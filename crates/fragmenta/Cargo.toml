[package]
name = "fragmenta"
version = "0.1.0"
edition = "2024"

[dependencies]
fragmenta-core = { path = "../fragmenta-core" }
gpui-kit = "0.7.1"
global-hotkey = "0.8.0"
raw-window-handle = "0.6"
smol = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }
