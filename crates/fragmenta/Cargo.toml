[package]
name = "fragmenta"
version = { workspace = true }
edition = "2024"

[dependencies]
fragmenta-core = { path = "../fragmenta-core" }
gpui-kit = "=0.8.1"
global-hotkey = "0.8.0"
tray-icon = "0.26.1"
raw-window-handle = "0.6"
smol = "2"
chrono = "0.4"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

# 托盘图标：解码内嵌 .ico（依赖树中 gpui 已编译 image，此处仅补 ico 解码特性）
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
# headless 测试（#[gpui_kit::test]）需要 test-support feature
gpui-kit = { version = "=0.8.1", features = ["test-support"] }
